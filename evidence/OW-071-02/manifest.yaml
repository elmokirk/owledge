gate: G-071-A-TRUTH
status: local_implementation_complete_pending_integration
branch: codex/ow07102-release-trust
base_commit: 44fc3b6b861be2f4755446d10da5fb21f1491bc3
execution_mode: local_serial
scope:
  outcome: >-
    Close FB-019, FB-020, and FB-021 with deterministic CLI dispatch,
    release metadata, concept-audit identity, and upgrade regression proof.
  planned_paths:
    - tools/owledge.py
    - tools/owledge_core.py
    - tools/validate_upgrade_notes.py
    - docs/upgrade-notes-schema.json
    - docs/upgrading.md
    - tests/unit/test_ow07102_release_trust.py
    - tests/fixtures/upgrade-notes/
    - evidence/OW-071-02/
  orchestrator_scope_expansion:
    - path: CHANGELOG.md
      reason: The current release itself must satisfy the new structured contract.
    - path: pyproject.toml
      reason: The wheel must ship CHANGELOG.md and the upgrade-note schema used by installed release gates.
    - path: tests/unit/test_release_notes.py
      reason: The existing release gate must use the same validator and verify package inventory.
decisions:
  - id: D-071-08-A
    disposition: retained
    item: FB-019
    decision: >-
      Keep would_update and would_create visible for additive upgrades; risk is
      communicated by alert_level rather than suppressing the actionable list.
  - id: D-071-08-B
    disposition: retracted
    item: FB-020
    decision: >-
      Remove the dead --since parser flag from both entrypoints instead of
      inventing semantically undefined date filtering.
  - id: D-071-08-C
    disposition: implemented
    item: FB-021
    decision: >-
      Require exactly one schema-valid JSON upgrade note in the current VERSION
      section and bind concept-audit freshness to type=concept-audit plus
      agent_id=concept-auditor.
artifacts:
  - CHANGELOG.md
  - docs/upgrade-notes-schema.json
