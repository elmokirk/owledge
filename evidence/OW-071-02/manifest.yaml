  - command: >-
      uv build --wheel --out-dir <isolated-temp>/ow07102-wheel-smoke
    exit_code: 0
    result: >-
      isolated wheel built; CHANGELOG.md, docs/upgrade-notes-schema.json, and
      tools/validate_upgrade_notes.py were present
  - command: git diff --check
    exit_code: 0
    result: no whitespace errors
negative_qa:
  - Missing breaking field fails with missing-breaking.
  - Malformed JSON fails with upgrade-json-malformed.
  - An old release note cannot satisfy the current release.
  - Duplicate current Upgrade notes headings fail deterministically.
  - Invalid enum values, empty summaries, and extra fields fail in stable order.
  - Semantic drift in the frozen schema fails with schema-contract.
  - --dry-run and --apply are mutually exclusive.
  - Parser-only --since flags are rejected by both CLI entrypoints.
  - Non-canonical concept-audit identity cannot satisfy freshness.
  - Unrelated non-Markdown template files do not create dogfood drift.
  - Upgrade drift runs doctor in kit mode.
  - Upgrade alert metadata is read from the source kit, not the target project.
review:
  method: focused_local_red_team
  result: pass
  notes:
    - >-
      The validator is standard-library-only and freezes both payload behavior
      and the semantic schema contract.
    - >-
      Cumulative independent QA remains required at G-071-A after OW-071-03 and
      OW-071-13; no extra ticket-level subagent was spawned.
limitations_and_routed_findings:
  - id: F-071-17
    severity: medium
    status: routed
    detail: >-
      The inherited central dist artifact is not ticket evidence. RC must
      rebuild wheel and sdist from committed clean source.
  - id: F-071-18
    severity: low
    status: routed
    detail: >-
      The wheel build reports setuptools license-table and license-classifier
      deprecations with a 2027-02-18 deadline. They do not affect v0.7.1
      correctness and should be normalized in a later packaging-maintenance
      ticket.
  - id: F-071-19
    severity: low
    status: resolved
    detail: >-
      Initial sandboxed publish-readiness and uv cache attempts lacked temporary
      write permissions. Replays with the required local permissions passed;
      this was environmental rather than a product failure.
qa_handoff:
  cumulative_gate: G-071-A-TRUTH
  required_replay:
    - python -m unittest tests.unit.test_ow07102_release_trust -v
    - uv run --with pytest pytest tests/unit/test_release_notes.py -q --tb=short
    - python tools/validate_upgrade_notes.py --project-root .
    - python tools/owledge.py test release-trust --project-root .
    - python tools/owledge.py test publish-readiness --project-root .
    - git diff --check
