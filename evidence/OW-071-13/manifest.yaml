execution_mode: local_serial
outcome: >-
  Classify the shipped HTTP adapter as local experimental, fail closed on
  non-loopback binding, and enforce a versioned endpoint, role, scope, error,
  and resource-bound contract.
decisions:
  - id: D-071-13-A
    decision: The serve profile is local-experimental and loopback-only.
    rationale: >-
      The repository has no reviewed remote deployment, TLS, identity lifecycle,
      backup, high-availability, or multi-process abuse-control contract.
  - id: D-071-13-B
    decision: >-
      The administrator token may register agents and read aggregate metrics,
      but may not perform tenant-scoped operations.
    rationale: >-
      Administrative bootstrap authority must not silently become cross-tenant
      data-plane authority.
  - id: D-071-13-C
    decision: >-
      Authenticated agent identity and the exact tenant/customer/project tuple
      are authoritative for every scoped endpoint.
    rationale: >-
      Tenant-only checks and caller-supplied agent identifiers allowed
      cross-project access and identity spoofing.
  - id: D-071-13-D
    decision: >-
      The v1 local profile fixes a 1 MiB body limit, 10 second request timeout,
      8 concurrent requests, and 120 requests per client per 60 seconds.
    rationale: >-
      Explicit process-local bounds make the experimental surface testable and
      prevent undocumented resource assumptions.
