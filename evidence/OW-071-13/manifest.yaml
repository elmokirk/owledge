negative_qa:
  - A non-loopback bind fails before project initialization.
  - An administrator token cannot enable remote binding.
  - Unauthenticated health output contains no path, database, or metric data.
  - Caller-supplied agent identity cannot override the authenticated identity.
  - Same-tenant, different-customer or different-project access fails.
  - Administrator access to scoped task, gate, context, promotion, and export operations fails.
  - Task, gate, and promotion identifier collisions fail closed.
  - A body one byte above the limit returns payload_too_large.
  - The ninth concurrent request returns concurrency_limit_exceeded.
  - A partial body exceeding the request timeout returns request_timeout.
  - The request after the rate window allowance returns rate_limit_exceeded.
findings:
  - id: F-071-09
    severity: critical
    status: resolved
    detail: >-
      The prior admin-token presence check permitted a non-loopback bind.
      Remote binding is now rejected before initialization regardless of token.
  - id: F-071-23
    severity: high
    status: resolved
    detail: >-
      Tenant-only authorization and upsert-style identifier reuse permitted
      cross-project access or resource reassignment. Exact three-part scope and
      fail-closed collision checks now protect tasks, gates, and promotions.
  - id: F-071-24
    severity: medium
    status: resolved
    detail: >-
      Handler-level concurrency admission could create unbounded worker
      threads before rejecting traffic. Admission now occurs at server dispatch.
  - id: F-071-25
    severity: medium
    status: resolved
    detail: >-
      The first independent review found that promotion PermissionError text
      could expose dynamic path or frontmatter details outside the published
      stable-code registry. The HTTP boundary now exposes only the two scoped
      authorization codes or operation_forbidden, and a curator-path negative
      fixture locks the behavior.
  - id: F-071-26
    severity: medium
    status: resolved
    detail: >-
      The first independent review found that the contract/runtime constant
      comparison did not probe enough rejected dispatch combinations and that
      the rate fixture stopped at the admission function. Dispatch-level role
      denials now cover every scoped endpoint family and an actual over-limit
      request asserts the HTTP 429 response.
limitations:
  - >-
    Rate state and concurrency admission are process-local; they are not a
    distributed abuse-control system.
  - >-
    TLS, non-loopback deployment, token rotation/revocation, backup/restore,
    high availability, and production Team Hub operation remain unsupported.
  - >-
    The broad dependency-free unittest discovery previously identified pytest
    imports in ten pytest-authored modules when pytest was unavailable in the
    environment. The focused standard-library OW-071-13 suite and applicable
    product gates are green; this environment limitation is not hidden.
review:
