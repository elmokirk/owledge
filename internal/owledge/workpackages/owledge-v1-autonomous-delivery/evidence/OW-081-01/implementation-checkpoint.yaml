  - "python tools/owledge.py test launch-readiness --project-root .: passed, 78 checks"
  - "python tools/owledge.py test runtime-adapters --project-root .: passed"
  - "python tools/build_project_folder_kit.py --output-path <temp> --verify: passed; AdapterManifest schema and validator shipped"
  - "python tools/validate_v1_delivery_plan.py: passed, 0 errors"
  - "git diff --check: passed"
