ticket: OW-081-01
status: accepted_independent_qa
scope:
  - AdapterManifest v1 schema and standard-library validator
  - Codex, Claude Code, and generic MCP/CLI fixture manifests
  - read-only add-on conformance runner and project-kit inclusion
contract:
  supported_profiles: [codex, claude-code, generic-mcp-cli]
