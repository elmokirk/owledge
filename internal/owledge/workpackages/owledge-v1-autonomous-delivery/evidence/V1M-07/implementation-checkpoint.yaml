negative_contracts:
  - "Revision conflict cannot create a canonical reviewed essence."
  - "Withdrawn source remains excluded while existing canonical Markdown is not mutated."
  - "Candidate, receipt, review and canonical paths reject symlink/path escapes."
  - "Review and sync require explicit arguments; no network route exists."
independent_qa:
  required: true
  mode: separately_initialized_read_only_data_safety_reviewer
  status: accepted
  result: accepted
  findings:
    - "Initial P1: identical transitions were not no-write idempotent; corrected by replaying the latest matching transition receipt."
    - "Initial P1: review, global, index and lifecycle-health reads could follow prepared symlink directories; corrected by shared resolved containment checks before enumeration or read."
    - "Initial P1: promote and terminal transitions could leave partial state when later receipt/tombstone paths failed; corrected with preflight and narrow rollback of a newly created canonical file."
    - "Initial P2: installation documentation still described review as unavailable; corrected to the enabled revision-bound lifecycle contract."
known_limitations:
  - "Windows cannot create symlinks in this runner; the existing host-gated symlink fixtures remain required stable-platform evidence and do not support a cross-platform claim."
publication_authority: not_granted
next_exact_action: "Run full V1M-07 verification, request independent data-safety QA, then commit only after accepted evidence."
