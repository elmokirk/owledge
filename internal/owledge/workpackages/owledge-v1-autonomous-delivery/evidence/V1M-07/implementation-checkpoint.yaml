ticket: V1M-07
status: accepted_independent_qa
base_commit: faefdeb
branch: codex/v071-integration
scope: local-review-promotion-tombstones-and-privacy-safe-health
implementation:
  - "Review is an explicit revision-bound state machine: promote, park, reject and supersede; terminal states cannot be silently reactivated."
  - "Promotion writes one private user_global reviewed essence, bound to the allowlisted origin project, Candidate bytes and review receipt."
  - "Reject and supersede write local tombstones; withdrawn, altered, unallowlisted or non-reviewed origins are excluded from recall as stale or tombstoned."
  - "The public sync verb only rebuilds the disposable local index after --rebuild-index; it never performs remote synchronization."
  - "Doctor includes a privacy-safe lifecycle-health receipt with IDs/counts for stale sources, invalid revisions, orphan receipts, promotion debt, context overflow and index drift; no bodies are emitted."
