      constraints: "Current v0.7.1 execution remains at OW-071-05 and v0.8.0 stays locked behind G-071-ALIGNMENT; Hub claims remain Beta and one organization per deployment; private user_global data is not uploaded implicitly; Pi and MCP remain adapters over shared Core semantics."
      affected_artifacts: ["ROADMAP.md", "owledge-v1-autonomous-delivery-master-plan.md", "BACKLOG.yaml", "AGENT-EXECUTION-MATRIX.yaml", "tickets/ALL-TICKETS.md", "gates/ALL-GATES.md", "TRACEABILITY.md", "OW-080-16", "OW-100-11"]
      verification_status: recorded_in_future_plan
    - id: D-071-26
      related: ["v1-architecture-sparring-2026-08-11", OW-081-08, OW-090-02, OW-090-03]
      authority: product-owner-request
      decision: "Keep private user_global local-first in v1; govern autonomous recall/capture through deterministic user settings; add a private global raw-inbox -> reviewed promotion or reasoned rejection/archive lifecycle."
      rationale: "These owner choices enable selective cross-project reuse without implicitly uploading or polluting private global knowledge."
      constraints: "Raw inbox content is excluded from normal retrieval and RAG; rejected knowledge retains reason and receipt; settings may narrow but never widen safety or authorization; current v0.7.1 execution and the G-071-ALIGNMENT lock remain unchanged."
      affected_artifacts: ["ROADMAP.md", "owledge-v1-autonomous-delivery-master-plan.md", "tickets/ALL-TICKETS.md", "gates/ALL-GATES.md", "TRACEABILITY.md", "GOAL.md"]
