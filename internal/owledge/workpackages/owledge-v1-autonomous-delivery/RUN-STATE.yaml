      constraints: "No DSAR workflow, subject identity graph, universal connector suite, binary/media warehouse, transcription engine, public plugin SDK/marketplace, or full Owledge harness enters V1. The exact PII Masker package remains unresolved until the owner supplies a package or repository. Current OW-071-05 execution and G-071-ALIGNMENT remain unchanged."
