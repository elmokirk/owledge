    - id: D-071-27
      related: ["v1-architecture-review-2026-08-11", OW-080-02, OW-100-03]
      authority: architecture-review
      decision: "Propose a versioned common-envelope plus artifact-profile Schema Registry and keep LangGraph, generic telemetry, multi-judge dispatch, full harness, scheduler, and frontend work outside the v1 Core."
      rationale: "The proposal removes frontmatter guessing and protects the deep Core seam while avoiding framework, observability, and runtime bloat."
      constraints: "Superseded by the owner-approved D-071-29 selection; compatibility migration must preserve user-authored Markdown."
      affected_artifacts: ["owledge-v1-federated-research-memory-and-pi-adapter-reprioritization.md", "owledge-v1-autonomous-delivery-master-plan.md", "OW-080-02", "v1 architecture research note"]
      verification_status: superseded_by_owner_approved_D-071-29
    - id: D-071-28
      related: ["v1-knowledge-levels-health-feedback-2026-08-12", OW-080-09, OW-081-09, OW-090-02, OW-090-06, OW-100-11]
      authority: product-owner-request
      decision: "Require an explicit version bump for every materially edited Owledge-managed document; make the promoted global layer a central Knowledge Base of reviewed Research essences, learnings, patterns, and transferable concepts; preserve authorized deep retrieval to project/source revisions; and add bounded Knowledge Health plus separate privacy-safe Hub operations health."
      rationale: "Large personal and enterprise knowledge bases need compact global orientation without losing project detail, plus deterministic maintainability and scale signals."
      constraints: "Global Raw remains an excluded private review queue rather than the global Knowledge Base; scope, abstraction, and lifecycle stay orthogonal; monitoring contains no raw prompts, outputs, or knowledge bodies; no dashboard or generic tracing backend enters the V1 critical path."
