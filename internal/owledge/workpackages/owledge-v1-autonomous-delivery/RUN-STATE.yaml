      severity: medium
      user_impact: "Planning artifacts can appear accepted while remaining outside the current canonical metadata contract."
      release_impact: "v0.7.1 truth normalization must reconcile legacy planning and Add-on handoff frontmatter."
      options: ["normalize in OW-071-01", "define a documented legacy exception", "expand validator coverage before promotion"]
      recommendation: "Normalize affected canonical planning artifacts in OW-071-01 and add deliberate validator coverage."
      safe_default: "Do not promote schema-invalid planning artifacts as canonical."
      status: resolved
    - id: F-071-02
      source: long-horizon-modes-and-skill-discovery-2026-07-27
      evidence: "Current Codex skill loader contract and fresh-init discovery regression tests"
      severity: high
      user_impact: "Project skills placed only in root skills/ or .owledge/skills can be present but fail to trigger because the harness does not discover them automatically."
      release_impact: "v0.7.1 adoption must materialize and diagnose supported discovery roots before claiming reliable agent integration."
      options: ["move canonical skills", "create additive harness mirrors", "require manual user-global installation"]
      recommendation: "Keep root skills/ canonical and create tracked .agents/skills mirrors plus plugin-local mirrors."
      safe_default: "Never claim automatic discovery from root skills/ or .owledge/skills."
      status: resolved
    - id: F-071-03
      source: long-horizon-modes-and-skill-discovery-qa-2026-07-27
      evidence: "Initial skill-validator and pytest commands failed under C:\\Python314 because PyYAML and pytest were absent; uv-isolated QA rerun passed."
      severity: low
      user_impact: "Contributors using bare system Python cannot run development-only validation commands without installing test dependencies."
      release_impact: "No runtime dependency impact because Owledge core remains standard-library-only; contributor QA instructions need an isolated dev environment."
      options: ["document uv test invocation", "add optional dev dependency group", "require manual global packages"]
      recommendation: "Keep runtime dependency-free and standardize an isolated uv-based contributor QA path."
      safe_default: "Do not add PyYAML or pytest as runtime dependencies."
      status: routed
    - id: F-071-04
      source: phase0-release-git-hygiene-review-2026-07-27
      evidence: "Finalization exports reported zero accepted/rejected dogfood records because the resolved memory-root contract did not match core scanner paths."
      severity: high
      user_impact: "A green finalization report could be vacuous and overstate release readiness."
      release_impact: "Phase 0 and all release gates require a non-empty dogfood scan regression before promotion."
      options: ["unify core functions on repo root", "resolve the active memory directory consistently"]
      recommendation: "Repair the root contract and fail finalization when the dogfood corpus is unexpectedly empty."
      safe_default: "Treat prior 35/35 evidence as stale until regenerated after the fix."
      status: resolved
    - id: F-071-05
      source: phase0-foundation-blindspot-redteam-2026-07-27
      evidence: "True legacy manifests omit .agents/skills rows, while safe upgrade iterated only installed manifest inventory."
      severity: high
      user_impact: "Existing initialized projects could remain unable to discover Owledge skills after upgrade."
      release_impact: "Discovery claims require additive current-inventory upgrade behavior and legacy-manifest regression coverage."
      options: ["add additive inventory upgrade", "retract safe-upgrade claim and require init-project rerun"]
      recommendation: "Implement safe additive inventory creation while preserving edited canonical skills."
      safe_default: "Do not claim legacy discovery migration until the true legacy fixture passes."
      status: resolved
    - id: F-071-06
      source: phase0-foundation-blindspot-redteam-2026-07-27
      evidence: "HOST_SKILL_DIRS includes owledge-autonomous-delivery but wheel data-files omitted it."
      severity: high
      user_impact: "Package-only init could silently ship an incomplete skill set."
      release_impact: "Wheel inventory and clean package-init smoke must cover every host skill before release."
      options: ["package the missing skill", "remove it from the promised host inventory"]
      recommendation: "Package and verify the complete declared host-skill inventory."
      safe_default: "Block package release on any declared skill missing from wheel init output."
      status: resolved
    - id: F-071-07
      source: phase0-control-plane-readiness-review-2026-07-27
      evidence: "The original W-071-A combined dependencies; after the first split, OW-071-02/03/13 still had overlapping tools, tests, core, and release-gate path claims."
      severity: high
      user_impact: "Agents could start blocked work or mutate ambiguous central paths."
      release_impact: "Wave topology and ticket path claims must validate before implementation dispatch."
      options: ["split the wave and harden validator", "execute the entire phase serially"]
      recommendation: "Execute OW-071-01/02/03/13 in separate sequential waves; parallelize only later tickets with exact non-overlapping file claims."
      safe_default: "Keep OW-071-01 as the only ready implementation ticket."
      status: resolved
    - id: F-071-08
      source: phase0-release-git-hygiene-review-2026-07-27
      evidence: "Generated evidence and one plan command contained absolute local user paths."
      severity: high
      user_impact: "Local identity/path details could leak into committed release evidence."
      release_impact: "Generators and staged-file privacy checks must produce portable sanitized artifacts."
      options: ["emit repository-relative paths", "replace local roots with stable placeholders"]
      recommendation: "Sanitize generator paths and reject staged private paths."
      safe_default: "Exclude current generated exports until regenerated and scanned."
      status: resolved
    - id: F-071-09
      source: phase0-foundation-blindspot-redteam-2026-07-27
      evidence: "HTTP non-loopback guard, unauthenticated health disclosure, and unbounded request body issues remain in tools/owledge_core.py."
      severity: critical
      user_impact: "Treating the local control plane as remotely safe could expose internal paths or enable abuse."
      release_impact: "OW-071-13 and G-071-A-TRUTH remain release blockers."
      options: ["harden the local server contract", "remove or strictly label unsupported remote exposure"]
      recommendation: "Resolve under OW-071-13 with negative security fixtures before public capability claims."
      safe_default: "Local loopback-only prototype; no supported remote/team-server claim."
      status: open
    - id: F-071-10
      source: phase0-clean-sha-finalization-attempt-1-2026-07-27
      evidence: "The sensitive-data gate treated the documented GitHub Actions permission id-token: write as a secret value."
      severity: high
      user_impact: "A legitimate release workflow permission blocked release finalization and obscured real secret findings."
      release_impact: "The scanner needs a narrow OIDC-permission exception while retaining positive token-value detection."
      options: ["allowlist exact GitHub OIDC permission values", "rewrite historical evidence to avoid the syntax"]
      recommendation: "Allow only id-token read/write/none permission values and keep an explicit real-token negative fixture."
      safe_default: "Do not weaken the generic token-value patterns."
      status: resolved
    - id: F-071-11
      source: phase0-clean-sha-finalization-attempt-1-2026-07-27
      evidence: "The generated-evidence privacy gate scanned the prior finalization latest report before the current sanitized report was persisted; escaped JSON paths also bypassed the first sanitizer."
      severity: high
      user_impact: "A safe current run could be blocked by stale evidence, while nested escaped errors could retain a private path."
      release_impact: "Finalization privacy must evaluate every newly persisted artifact and sanitize native plus JSON-escaped roots."
      options: ["post-write verification", "exclude finalization reports permanently"]
      recommendation: "Use a pre-write scan for other exports plus a mandatory post-write full scan, and sanitize escaped roots."
      safe_default: "No evidence commit until the post-write full scan passes."
      status: resolved
    - id: F-071-12
      source: OW-071-01-independent-qa-2026-07-27
      evidence: "Commit f189bace left POST-001 both done and pending, targeted POST-002 at v0.7.1 despite OW-100-05, and described the live-register reset as future work."
      severity: high
      user_impact: "Agents can select already-completed or wrongly-versioned work from an active roadmap."
      release_impact: "OW-071-01 cannot pass until active roadmap truth is singular and regression-tested."
      options: ["remove the duplicate status table and synchronize targets", "mark the conflicting sections as historical snapshots"]
      recommendation: "Keep one active release board, bind CLI simplification to OW-100-05/v1.0, and describe the register reset as completed."
      safe_default: "Do not promote OW-071-01 while active sources contradict the live register."
      status: resolved
    - id: F-071-13
      source: OW-071-01-independent-qa-2026-07-27
      evidence: "Malformed allowed_states, source_documents, or authority source-list types raised uncaught TypeError instead of structured deterministic JSON."
      severity: high
      user_impact: "A corrupt or hand-edited register produces a traceback instead of actionable recovery guidance."
      release_impact: "The fail-closed validator contract requires controlled diagnostics for malformed schema types."
      options: ["validate container and element types before conversion", "adopt a runtime schema dependency"]
      recommendation: "Add explicit standard-library type validation and adversarial regression tests."
      safe_default: "Treat traceback-producing malformed inputs as a failed ticket gate."
      status: resolved
    - id: F-071-14
      source: OW-071-01-independent-qa-2026-07-27
      evidence: "The ticket required python -m pytest although pytest is not a runtime dependency; the committed manifest truthfully replayed the unittest-based suite instead."
      severity: high
      user_impact: "A documented release replay fails in a clean standard-library environment even though the product validator is dependency-free."
      release_impact: "Ticket contract and evidence manifest must name the same reproducible gate command."
      options: ["add pytest as a product dependency", "standardize the ticket on unittest", "document an isolated uv development command"]
      recommendation: "Use python -m unittest for this dependency-free ticket and reserve isolated pytest for repository-wide development QA."
      safe_default: "Do not add pytest to Owledge runtime dependencies."
      status: resolved
    - id: F-071-15
      source: OW-071-01-independent-qa-2026-07-27
      evidence: "The accepted worker manifest cannot contain its own commit SHA and therefore retains an explicit placeholder; integration-review.yaml now binds the immutable accepted source."
      severity: low
      user_impact: "Ticket evidence is human-readable but not fully machine-bound to the reviewed commit by itself."
      release_impact: "Integration evidence must bind the immutable worker commit, tree, and manifest blob without amending the reviewed commit."
      options: ["create separate integration evidence", "attempt a self-referential manifest amendment"]
      recommendation: "Use the separate binding for commit 86871c6, tree e00efc8, and manifest blob 3c52990 as the authoritative integration status."
      safe_default: "Never rewrite the reviewed worker commit merely to embed its own SHA."
      status: resolved
    - id: F-071-16
      source: OW-071-01-independent-rereview-2026-07-27
      evidence: "The v1 live-work validator deliberately tolerates unknown extension fields while strictly validating all release-critical known fields."
      severity: low
      user_impact: "A misspelled non-critical extension field may be preserved without an immediate schema error."
      release_impact: "No v0.7.1 gate impact; strict additionalProperties behavior requires an explicit schema-versioning decision."
      options: ["reject all unknown fields in schema v1", "retain extension tolerance and decide under schema contracts"]
      recommendation: "Route strict-field policy to OW-080-02 rather than expanding the frozen v0.7.1 register contract."
      safe_default: "Known release-critical fields remain fail-closed; unknown fields confer no authority."
      status: routed
    - id: F-071-17
      source: OW-071-02-definition-of-ready-2026-07-27
      evidence: "The central worktree contains an unreadable legacy dist/owledge-0.7.0.tar.gz that can make publish-readiness non-reproducible outside a fresh worktree."
      severity: medium
      user_impact: "A maintainer may mistake a corrupt stale local artifact for a source-level publish-readiness failure."
      release_impact: "OW-071-02 must test in a fresh isolated worktree; RC must rebuild artifacts from committed source."
      options: ["reuse the stale artifact", "exclude it from ticket proof and rebuild at RC"]
      recommendation: "Do not trust inherited dist artifacts; prove ticket gates without dist and rebuild wheel/sdist during OW-071-08."
      safe_default: "No deletion or publication action is authorized; stale dist is never cited as evidence."
      status: routed
    - id: F-071-18
      source: OW-071-02-wheel-inventory-smoke-2026-07-27
      evidence: "Setuptools reports deprecated project.license table and license classifiers with a 2027-02-18 support deadline."
      severity: low
      user_impact: "A future packaging-tool upgrade could turn current metadata warnings into a build failure."
      release_impact: "No v0.7.1 correctness impact; the clean wheel built and contained every required OW-071-02 artifact."
      options: ["normalize SPDX license metadata in a later packaging ticket", "expand OW-071-02 beyond release-trust scope"]
      recommendation: "Route to later packaging maintenance and keep the v0.7.1 release-trust slice bounded."
      safe_default: "Do not ignore the deadline, but do not destabilize this release slice with unrelated metadata churn."
      status: routed
    - id: F-071-19
      source: OW-071-02-sandboxed-gate-replay-2026-07-27
      evidence: "Initial uv cache, py_compile, and MCP temporary writes were denied by the managed sandbox; authorized local replays passed."
      severity: low
      user_impact: "A contributor can misread environment write denial as a product regression."
      release_impact: "Resolved for this ticket by an exact clean-commit replay; publish-readiness scored 155 with zero blockers."
      options: ["run temporary-write gates with required permissions", "change product behavior to work around the host sandbox"]
      recommendation: "Classify host permission failures explicitly and replay the unchanged gate with the required local permissions."
      safe_default: "Never waive a failed gate; require a successful replay against the same source."
      status: resolved
    - id: F-071-20
      source: OW-071-03-benchmark-truth-preflight-2026-07-27
      evidence: "A published Qwen raw run reported passed=false and four timeouts but was still counted as completed release proof."
      severity: high
      user_impact: "A public benchmark comparison could overstate the number of successfully evaluated model profiles."
      release_impact: "The v0.7 regression baseline must exclude incomplete runs fail-closed while retaining their raw evidence."
      options: ["reject incomplete reports from comparison", "rerun and replace the raw report", "keep counting failed runs"]
      recommendation: "Reject incomplete reports, preserve the raw artifact unchanged, and publish its exclusion status."
      safe_default: "Only reports with passed=true and no errors can contribute to the release verdict."
      status: resolved
    - id: F-071-21
      source: OW-071-03-cross-platform-hash-replay-2026-07-27
      evidence: "Windows-generated comparison files used CRLF while Git-normalized checkouts used LF, changing frozen artifact hashes."
      severity: medium
      user_impact: "A valid clean checkout could fail baseline validation solely because of platform newline conversion."
      release_impact: "Frozen benchmark evidence requires byte-stable cross-platform generation."
      options: ["emit LF explicitly", "remove generated-file hashes", "accept platform-specific baselines"]
      recommendation: "Emit LF explicitly and regression-test the generated files for CRLF absence."
      safe_default: "Do not weaken the hash contract."
      status: resolved
    - id: F-071-22
      source: OW-071-03-public-claim-review-2026-07-27
      evidence: "Illustrative external API price snapshots lack a machine-readable retrieval date."
      severity: low
      user_impact: "Readers may mistake time-sensitive illustrative pricing for a current verified claim."
      release_impact: "No baseline-verdict impact; freshness governance remains necessary for public claims."
      options: ["add dated claim metadata", "remove pricing examples", "leave them undated"]
      recommendation: "Route dated claim governance to OW-071-04 and keep pricing outside the baseline verdict."
      safe_default: "Treat undated prices as illustrative only."
      status: routed
