      authority: product-owner
      decision: "Keep the coverage-bounded personal-data erasure/DSAR control plane outside V1 as a relevant post-v1 enterprise module. Retain only general V1 source-withdrawal, revocation, tombstone, and derived-projection hygiene, and add the minimal managed-surface, transactional-upgrade, module-manifest, ResourceRef, and separated-health compatibility seams to existing tickets. Treat a PII Masker only as a future detection/redaction adapter, not deletion proof."
